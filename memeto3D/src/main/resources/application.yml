server:
  port: ${PORT:8080}

spring:
  application:
    name: memeto3D
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5431}/${DB_NAME:memeto3d_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:2404}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:absolute-tomcat-224856.upstash.io}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:gQAAAAAAA25YAAIgcDI1MTM4ZWIyZDk2MTE0ODZjYTM4ZjJmYmZlYjM4Zjc2MA}
      ssl:
        enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # 3600000 ms = 1 hour
    expiration-ms: ${JWT_EXPIRATION:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    doc-expansion: list
