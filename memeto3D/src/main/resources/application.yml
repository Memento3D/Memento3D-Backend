server:
  port: ${PORT:8080}

spring:
  config:
    import:
      - optional:file:./memeto3D/.env[.properties]
      - optional:file:./.env[.properties]
  application:
    name: memeto3D
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      data-locations: classpath:data.sql
  jpa:
    open-in-view: false
#    defer-datasource-initialization: true
    defer-datasource-initialization: false
    hibernate:
#      ddl-auto: ${DDL_AUTO:update}
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    baseline-on-migrate: false
    baseline-version: "1"
    validate-on-migrate: true
    clean-disabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  cache:
    user-ttl-hours: ${USER_CACHE_TTL_HOURS:1}
    scan-status-ttl-hours: ${SCAN_STATUS_CACHE_TTL_HOURS:6}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # 3600000 ms = 1 hour
    expiration-ms: ${JWT_EXPIRATION:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5173}
  ai:
    base-url: ${AI_BASE_URL}
    api-key: ${AI_API_KEY}
    dispatch-enabled: ${AI_DISPATCH_ENABLED:false}
    dispatch-delay-ms: 10000
    connection-check-enabled: ${AI_CONNECTION_CHECK_ENABLED:false}
    sync-enabled: ${AI_SYNC_ENABLED:false}
    sync-delay-ms: 10000
    execution-mode: ${AI_EXECUTION_MODE:real}
    mock-enabled: ${AI_MOCK_ENABLED:false}
    mock-output-id: ${AI_MOCK_OUTPUT_ID:}
    mock-delay-ms: ${AI_MOCK_DELAY_MS:2000}
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    doc-expansion: list
