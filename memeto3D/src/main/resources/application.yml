server:
  port: ${PORT:8080}

spring:
  config:
    import:
      - optional:file:./memeto3D/.env[.properties]
      - optional:file:./.env[.properties]
  application:
    name: memeto3D
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      data-locations: classpath:data.sql
  jpa:
    open-in-view: false
#    defer-datasource-initialization: true
    defer-datasource-initialization: false
    hibernate:
#      ddl-auto: ${DDL_AUTO:update}
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    baseline-on-migrate: false
    baseline-version: "1"
    validate-on-migrate: true
    clean-disabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:memento3d-backend-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record
      missing-topics-fatal: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"



cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  frontend:
    # Used ONLY server-side to build links inside emails (never taken from the request).
    base-url: ${FRONTEND_BASE_URL:http://localhost:5174}
  mail:
    # SMTP sender bean is created only when MAIL_HOST is set (see MailConfig).
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    smtp-auth: ${MAIL_SMTP_AUTH:true}
    starttls: ${MAIL_SMTP_STARTTLS:true}
    ssl: ${MAIL_SMTP_SSL:false}
    from: ${MAIL_FROM:no-reply@memento3d.local}
    from-name: ${MAIL_FROM_NAME:Memento3D}
  security:
    # Set to true only behind a trusted reverse proxy that overwrites X-Forwarded-For.
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    password-reset:
      token-ttl-minutes: 15
  cache:
    user-ttl-hours: ${USER_CACHE_TTL_HOURS:1}
    scan-status-ttl-hours: ${SCAN_STATUS_CACHE_TTL_HOURS:6}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # 3600000 ms = 1 hour
    expiration-ms: ${JWT_EXPIRATION:3600000}
  oauth2:
    authorized-redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5174/oauth2/redirect}
    cookie-expire-seconds: 180
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5173,http://localhost:3000,http://localhost:8080}
  printing:
    agent:
      poll-interval-seconds: ${PRINTER_AGENT_POLL_INTERVAL_SECONDS:5}
      heartbeat-timeout-seconds: ${PRINTER_AGENT_HEARTBEAT_TIMEOUT_SECONDS:45}
      liveness-check-interval-ms: ${PRINTER_AGENT_LIVENESS_INTERVAL_MS:15000}
      liveness-enabled: ${PRINTER_AGENT_LIVENESS_ENABLED:true}
  payment:
    momo:
      partner-code: ${MOMO_PARTNER_CODE:MOMO}
      access-key: ${MOMO_ACCESS_KEY:F8BBA842ECF85}
      secret-key: ${MOMO_SECRET_KEY:K951B6PE1wa8ngfBW/gahOD0viQDuMmq}
      endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
      query-endpoint: ${MOMO_QUERY_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/query}
      redirect-url: ${MOMO_REDIRECT_URL:http://localhost:3000/payment/result}
      ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/payments/webhooks/momo}
      request-type: ${MOMO_REQUEST_TYPE:captureWallet}
      timeout-seconds: ${MOMO_TIMEOUT_SECONDS:30}
    zalopay:
      app-id: ${ZALOPAY_APP_ID:2553}
      key1: ${ZALOPAY_KEY1:PcY4iZIKFCIdgZvA6ueMcMHHUbRLYjPL}
      key2: ${ZALOPAY_KEY2:kLtgPl8HHhfvMuD2wKfgccM4nwqiEdtF}
      endpoint: ${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/create}
      query-endpoint: ${ZALOPAY_QUERY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/query}
      callback-url: ${ZALOPAY_CALLBACK_URL:http://localhost:8080/api/payments/webhooks/zalopay}
      redirect-url: ${ZALOPAY_REDIRECT_URL:http://localhost:3000/payment/result}
      timeout-seconds: ${ZALOPAY_TIMEOUT_SECONDS:30}
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay/return}
      ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay/ipn}

payment:
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay/return}
    ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay/ipn}
  ai:
    base-url: ${AI_BASE_URL}
    api-key: ${AI_API_KEY}
    dispatch-enabled: ${AI_DISPATCH_ENABLED:false}
    dispatch-delay-ms: 10000
    connection-check-enabled: ${AI_CONNECTION_CHECK_ENABLED:false}
    sync-enabled: ${AI_SYNC_ENABLED:false}
    sync-delay-ms: 10000
    execution-mode: ${AI_EXECUTION_MODE:real}
    mock-enabled: ${AI_MOCK_ENABLED:false}
    mock-output-id: ${AI_MOCK_OUTPUT_ID:}
    mock-delay-ms: ${AI_MOCK_DELAY_MS:2000}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      reconstruction: ${KAFKA_TOPIC_RECONSTRUCTION:memento3d.reconstruction}
      orders: ${KAFKA_TOPIC_ORDERS:memento3d.orders}
      payments: ${KAFKA_TOPIC_PAYMENTS:memento3d.payments}
      printjobs: ${KAFKA_TOPIC_PRINTJOBS:memento3d.printjobs}
      quality: ${KAFKA_TOPIC_QUALITY:memento3d.quality}
      notifications: ${KAFKA_TOPIC_NOTIFICATIONS:memento3d.notifications}
      dlt: ${KAFKA_TOPIC_DLT:memento3d.dlt}
    outbox:
      poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
      batch-size: ${OUTBOX_BATCH_SIZE:50}
      max-retries: 5
  realtime:
    sse:
      timeout-ms: ${SSE_TIMEOUT_MS:300000}
      heartbeat-interval-ms: ${SSE_HEARTBEAT_INTERVAL_MS:15000}
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    doc-expansion: list

payment:
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay/return}
    ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay/ipn}
    version: "2.1.0"
    command: "pay"
    currency: "VND"
    order-type: "other"
    locale: "vn"
    expire-minutes: 15

