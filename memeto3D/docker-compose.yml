services:

  postgres:
    image: postgres:17-alpine
    container_name: memeto3d-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: chỉ báo healthy khi server thật đã chạy xong init script
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: memeto3d-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: memeto3d-backend
    restart: unless-stopped
    depends_on:
#      postgres:
#        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
#      DB_NAME: ${POSTGRES_DB}
      DB_NAME: ${DB_NAME}
#      DB_USERNAME: ${POSTGRES_USER}
      DB_USERNAME: ${DB_USERNAME}
#      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MODEL_STORAGE_PROVIDER: ${MODEL_STORAGE_PROVIDER:-cloudinary}
      B2_ENDPOINT: ${B2_ENDPOINT:-https://s3.us-east-005.backblazeb2.com}
      B2_REGION: ${B2_REGION:-us-east-005}
      B2_BUCKET: ${B2_BUCKET:-memento3d-models-tiendon}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
      B2_URL_TTL_SECONDS: ${B2_URL_TTL_SECONDS:-3600}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      REDIS_TIMEOUT: 2000ms
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_DISPATCH_ENABLED: ${AI_DISPATCH_ENABLED:-false}
      AI_CONNECTION_CHECK_ENABLED: ${AI_CONNECTION_CHECK_ENABLED:-false}
      AI_SYNC_ENABLED: ${AI_SYNC_ENABLED:-false}
      AI_EXECUTION_MODE: ${AI_EXECUTION_MODE:-real}
      AI_MOCK_ENABLED: ${AI_MOCK_ENABLED:-false}
      AI_MOCK_OUTPUT_ID: ${AI_MOCK_OUTPUT_ID:-}
      AI_MOCK_DELAY_MS: ${AI_MOCK_DELAY_MS:-2000}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:5173/payment/vnpay/return}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-http://localhost:8080/api/v1/payments/vnpay/ipn}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres_data:
  redis_data: